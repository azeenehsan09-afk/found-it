<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | FindIt</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-page">
        <a class="brand" href="index.html">Find<span>It</span></a>

        <section class="auth-card">
            <p class="eyebrow">JOIN FINDIT</p>
            <h1>Create your account</h1>
            <p class="subtitle">Create an account to report items and track your activity.</p>

            <form id="signupForm">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" name="fullName"
                       placeholder="Your full name" autocomplete="name" maxlength="80" required>

                <label for="email">Email address</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="At least 8 characters" autocomplete="new-password"
                       minlength="8" required>

                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Enter your password again" autocomplete="new-password"
                       minlength="8" required>

                <p class="form-message" id="formMessage" aria-live="polite"></p>
                <button class="primary-button" type="submit" id="submitButton">Create account</button>
            </form>

            <p class="switch-page">Already have an account? <a href="login.html">Login</a></p>
            <a class="back-link" href="index.html">← Back to home</a>
        </section>
        <p class="footer-note">FindIt · Helping lost items find their way home</p>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
